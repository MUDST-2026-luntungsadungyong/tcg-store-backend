server:
  port: 8080

spring:
  application:
    name: tcg-store-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tcg_store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.mythix.tcg: DEBUG
