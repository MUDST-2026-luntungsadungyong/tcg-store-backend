server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: tcg-store-backend
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tcg_store}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    # Existing pre-Flyway environments are treated as the old V8 shape so V9
    # always gets a chance to normalize legacy cards/products table names.
    baseline-version: "8"
    baseline-description: pre-flyway-v8-schema
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        application: ${spring.application.name}
        environment: ${APP_ENVIRONMENT:local}
  level:
    root: INFO
    com.mythix.tcg: ${APP_LOG_LEVEL:INFO}
    com.zaxxer.hikari.pool.HikariPool: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:local}
    distribution:
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
  jwt:
    # Deliberately empty by default: JwtProperties fails fast unless a profile or
    # environment supplies a strong secret. Local development may opt into the
    # explicitly named dev profile, while test/postgres profiles provide fixtures.
    secret: ${APP_JWT_SECRET:}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  seller:
    product-images:
      object-storage-endpoint: ${OBJECT_STORAGE_ENDPOINT:}
      object-storage-region: ${OBJECT_STORAGE_REGION:us-east-2}
      object-storage-bucket: ${OBJECT_STORAGE_BUCKET:}
      object-storage-public-base-url: ${OBJECT_STORAGE_PUBLIC_BASE_URL:}
      object-storage-path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
      object-storage-access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
      object-storage-secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
