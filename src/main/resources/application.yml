server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: tcg-store-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tcg_store}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.mythix.tcg: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Development default only. Set APP_JWT_SECRET in shared and production environments.
    secret: ${APP_JWT_SECRET:change-this-development-only-secret-key-to-a-secure-32-byte-value}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
