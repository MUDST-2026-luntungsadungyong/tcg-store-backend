apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tcg-body-buffer
spec:
  buffering:
    maxRequestBodyBytes: 8388608
    memRequestBodyBytes: 2097152
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tcg-auth-rate-limit
spec:
  rateLimit:
    average: 5
    period: 1s
    burst: 10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tcg-api-rate-limit
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tcg-edge-chain
spec:
  chain:
    middlewares:
      - name: tcg-body-buffer
      - name: tcg-api-rate-limit
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tcg-auth-chain
spec:
  chain:
    middlewares:
      - name: tcg-body-buffer
      - name: tcg-auth-rate-limit
