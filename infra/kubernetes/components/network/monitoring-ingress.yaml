apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tcg-store-backend-monitoring-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tcg-store-backend
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    # Azure Managed Prometheus runs its collector in kube-system. Keep the
    # scrape path inside the cluster; the backend Service remains ClusterIP.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              rsName: ama-metrics
      ports:
        - protocol: TCP
          port: 8080
