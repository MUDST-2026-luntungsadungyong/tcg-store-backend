apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-store-backend
  labels:
    app.kubernetes.io/name: tcg-store-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tcg-store-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcg-store-backend
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: tcg-store-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tcg-store-backend
              app.kubernetes.io/component: api
      containers:
        - name: backend
          image: tcg-store-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tcg-store-backend-config
          env:
            - name: NEON_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-jdbc-url
            - name: NEON_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-db-username
            - name: NEON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-db-password
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: app-jwt-secret
            - name: NEON_POOL_MAX_SIZE
              value: "5"
            - name: NEON_POOL_MIN_IDLE
              value: "0"
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: object-storage-access-key
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: object-storage-secret-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
