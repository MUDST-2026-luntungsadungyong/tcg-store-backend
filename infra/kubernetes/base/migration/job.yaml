apiVersion: batch/v1
kind: Job
metadata:
  name: tcg-store-backend-migration
  labels:
    app.kubernetes.io/name: tcg-store-backend
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tcg-store-backend
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: Never
      serviceAccountName: tcg-store-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: migration
          image: tcg-store-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - java
            - -Dloader.main=com.mythix.tcg.DatabaseMigrationApplication
            - -cp
            - /app/app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
          envFrom:
            - configMapRef:
                name: tcg-store-backend-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: neon,migration
            - name: FLYWAY_ENABLED
              value: "true"
            - name: NEON_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-jdbc-url
            - name: NEON_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-db-username
            - name: NEON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-db-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
