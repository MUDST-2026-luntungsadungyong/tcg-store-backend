apiVersion: v1
kind: ConfigMap
metadata:
  name: tcg-store-backend-config
data:
  APP_ENVIRONMENT: local
  SPRING_PROFILES_ACTIVE: neon
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  FLYWAY_ENABLED: "false"
  APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
  OBJECT_STORAGE_ENDPOINT: http://s3mock-local:9090
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: tcg-product-images-local
  OBJECT_STORAGE_PUBLIC_BASE_URL: http://localhost:9090/tcg-product-images-local
  OBJECT_STORAGE_PATH_STYLE: "true"
  APP_LOG_LEVEL: INFO
  JPA_SHOW_SQL: "false"
