apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcg-store-local

resources:
  - ../prerequisites
  - ../../../base/migration
  - serviceaccount.yaml

images:
  - name: tcg-store-backend
    newName: tcg-store-service-backend
    newTag: dev

patches:
  - path: migration-hardening.yaml
  - path: migration-secret-contract.yaml
