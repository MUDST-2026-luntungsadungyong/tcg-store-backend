apiVersion: batch/v1
kind: Job
metadata:
  name: tcg-store-backend-migration
spec:
  template:
    spec:
      containers:
        - name: migration
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: neon,migration
            - name: NEON_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-migration-jdbc-url
            - name: NEON_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-migration-db-username
            - name: NEON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-migration-db-password
