apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tcg-store-staging

resources:
  - prerequisites
  - ../../base

components:
  - ../../components/edge

images:
  - name: tcg-store-backend
    newName: ghcr.io/mudst-2026-luntungsadungyong/tcg-store-backend
    newTag: sha-REPLACE_ME

patches:
  - path: patches/deployment-hardening.yaml
  - path: patches/image-pull-secret.yaml
  - path: patches/service-api-selector.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: tcg-store-backend
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.example.invalid
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.example.invalid
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: tcg-store-backend-auth
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.example.invalid
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.example.invalid

replacements:
  - source:
      kind: Ingress
      name: tcg-store-backend
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Ingress
          name: tcg-store-backend
        fieldPaths:
          - metadata.annotations.[traefik.ingress.kubernetes.io/router.middlewares]
        options:
          delimiter: '-'
          index: 0
      - select:
          kind: Ingress
          name: tcg-store-backend-auth
        fieldPaths:
          - metadata.annotations.[traefik.ingress.kubernetes.io/router.middlewares]
        options:
          delimiter: '-'
          index: 0
      - select:
          group: ""
          version: v1
          kind: Service
          name: tcg-store-backend
        fieldPaths:
          - metadata.annotations.[traefik.ingress.kubernetes.io/service.serverstransport]
        options:
          delimiter: '-'
          index: 0
