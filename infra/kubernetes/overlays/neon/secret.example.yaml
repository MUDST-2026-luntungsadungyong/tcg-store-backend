apiVersion: v1
kind: Secret
metadata:
  name: tcg-store-backend-secrets
type: Opaque
stringData:
  neon-jdbc-url: jdbc:postgresql://ep-example.ap-southeast-1.aws.neon.tech/tcg_store?sslmode=require&channelBinding=require
  neon-db-username: replace-with-neon-role
  neon-db-password: replace-with-neon-password
  app-jwt-secret: replace-with-a-random-secret-at-least-32-bytes
