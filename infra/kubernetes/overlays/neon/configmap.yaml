apiVersion: v1
kind: ConfigMap
metadata:
  name: tcg-store-backend-config
data:
  SPRING_PROFILES_ACTIVE: neon
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  APP_CORS_ALLOWED_ORIGINS: https://replace-with-frontend-origin
  APP_PUBLIC_BASE_URL: https://replace-with-backend-origin
  SELLER_PRODUCT_IMAGE_DIR: /app/uploads/products
  APP_LOG_LEVEL: INFO
  JPA_SHOW_SQL: "false"
