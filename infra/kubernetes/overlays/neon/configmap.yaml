apiVersion: v1
kind: ConfigMap
metadata:
  name: tcg-store-backend-config
data:
  SPRING_PROFILES_ACTIVE: neon
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SELLER_PRODUCT_IMAGE_STORAGE: s3
  APP_CORS_ALLOWED_ORIGINS: https://replace-with-frontend-origin
  APP_PUBLIC_BASE_URL: https://replace-with-backend-origin
  OBJECT_STORAGE_ENDPOINT: https://replace-with-object-storage-endpoint
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: tcg-product-images
  OBJECT_STORAGE_PUBLIC_BASE_URL: https://replace-with-object-storage-public-base-url
  OBJECT_STORAGE_PATH_STYLE: "false"
  APP_LOG_LEVEL: INFO
  JPA_SHOW_SQL: "false"
