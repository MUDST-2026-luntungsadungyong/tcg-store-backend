apiVersion: v1
kind: ConfigMap
metadata:
  name: tcg-store-backend-config
data:
  APP_ENVIRONMENT: production
  SPRING_PROFILES_ACTIVE: neon
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  FLYWAY_ENABLED: "false"
  APP_CORS_ALLOWED_ORIGINS: https://store.example.invalid
  OBJECT_STORAGE_ENDPOINT: https://object-storage.example.invalid
  OBJECT_STORAGE_REGION: us-east-2
  OBJECT_STORAGE_BUCKET: tcg-product-images-production
  OBJECT_STORAGE_PUBLIC_BASE_URL: https://cdn.example.invalid/tcg-product-images-production
  OBJECT_STORAGE_PATH_STYLE: "true"
  APP_LOG_LEVEL: INFO
  JPA_SHOW_SQL: "false"
