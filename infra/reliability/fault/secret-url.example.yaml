# Merge this single key into tcg-store-backend-secrets only while applying the
# fault overlay. This URL targets only the isolated in-cluster PostgreSQL lab.
apiVersion: v1
kind: Secret
metadata:
  name: tcg-store-backend-secrets
  namespace: tcg-store-acceptance
type: Opaque
stringData:
  neon-jdbc-url: jdbc:postgresql://127.0.0.1:15432/tcg_store_acceptance?sslmode=disable&channelBinding=disable
