apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-store-backend
spec:
  template:
    spec:
      initContainers:
        - name: db-fault-proxy
          # Native sidecar: starts before the application and remains until it
          # exits, making the proxy listener available before Spring boot.
          restartPolicy: Always
          image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:a3e244375123dad8849091bcc59775e188624d3f602db01901f9af855682fef8
          imagePullPolicy: IfNotPresent
          args:
            - -host=127.0.0.1
            - -config=/etc/toxiproxy/proxies.json
          ports:
            - name: db-proxy
              containerPort: 15432
              protocol: TCP
            - name: toxiproxy-admin
              containerPort: 8474
              protocol: TCP
          startupProbe:
            exec:
              command: ["/toxiproxy-cli", "list"]
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/toxiproxy-cli", "list"]
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/toxiproxy-cli", "list"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-fault-proxy-config
              mountPath: /etc/toxiproxy
              readOnly: true
      volumes:
        - name: db-fault-proxy-config
          configMap:
            name: tcg-db-fault-proxy-config
