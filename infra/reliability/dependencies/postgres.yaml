apiVersion: v1
kind: Service
metadata:
  name: postgres-acceptance
spec:
  selector:
    app.kubernetes.io/name: postgres-acceptance
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-acceptance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-acceptance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-acceptance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          imagePullPolicy: IfNotPresent
          args: ["-c", "max_connections=60"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: tcg_store_acceptance
            - name: POSTGRES_USER
              value: tcg_acceptance
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tcg-store-backend-secrets
                  key: neon-db-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tcg_acceptance", "-d", "tcg_store_acceptance"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
