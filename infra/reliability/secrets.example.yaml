# Example only: contains placeholders and MUST NOT be included in kustomization
# or applied as-is. Create the Secret from an approved secret manager workflow.
apiVersion: v1
kind: Secret
metadata:
  name: tcg-store-backend-secrets
  namespace: tcg-store-acceptance
type: Opaque
stringData:
  neon-jdbc-url: jdbc:postgresql://postgres-acceptance.tcg-store-acceptance.svc.cluster.local:5432/tcg_store_acceptance?sslmode=disable&channelBinding=disable
  neon-db-username: tcg_acceptance
  neon-db-password: replace-with-dedicated-acceptance-password
  app-jwt-secret: replace-with-random-acceptance-only-secret-at-least-32-bytes
  object-storage-access-key: acceptance-only
  object-storage-secret-key: replace-with-acceptance-only-secret
