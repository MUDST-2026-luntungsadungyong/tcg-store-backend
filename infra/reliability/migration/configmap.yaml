apiVersion: v1
kind: ConfigMap
metadata:
  name: tcg-store-backend-config
data:
  SPRING_PROFILES_ACTIVE: neon
  APP_ENVIRONMENT: acceptance
  SERVER_PORT: "8080"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  FLYWAY_ENABLED: "false"
  APP_CORS_ALLOWED_ORIGINS: http://localhost:18080
  OBJECT_STORAGE_ENDPOINT: http://s3mock-acceptance:9090
  OBJECT_STORAGE_REGION: ap-southeast-1
  OBJECT_STORAGE_BUCKET: tcg-store-acceptance
  OBJECT_STORAGE_PUBLIC_BASE_URL: http://s3mock-acceptance:9090/tcg-store-acceptance
  OBJECT_STORAGE_PATH_STYLE: "true"
  APP_LOG_LEVEL: INFO
  JPA_SHOW_SQL: "false"
