global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/observability/rules/*.yml

scrape_configs:
  - job_name: tcg-store-backend
    metrics_path: /actuator/prometheus
    scheme: http
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - tcg-store-staging
            - tcg-store-production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: tcg-store-backend
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: environment
        regex: tcg-store-(staging|production)
        replacement: $1
      - target_label: app
        replacement: tcg-store-backend
