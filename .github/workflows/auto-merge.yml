name: Auto Enable Merge Queue

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge into Queue
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable Auto-Merge
        run: |
          set +e
          output="$(gh pr merge ${{ github.event.pull_request.number }} --repo MUDST-2026-luntungsadungyong/tcg-store-backend --auto --merge 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! grep -Eq 'Auto merge is already enabled|already in the merge queue' <<< "$output"; then
            exit "$status"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
