name: CI Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Java Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven build & tests
        run: ./mvnw --batch-mode verify

  tidb-revision5-contract:
    name: TiDB Revision 5 Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Revision 5 migration and JPA contract
        run: ./mvnw --batch-mode -Dtest=TidbRevision5SchemaContractTests test

  postgres-concurrency:
    name: PostgreSQL checkout concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tcg_store_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tcg_store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify PostgreSQL concurrency
        run: ./mvnw --batch-mode -Dspring.profiles.active=postgres -Dtest=CheckoutConcurrencyPostgresTests verify

  db-schema-validation:
    name: Flyway Fresh, Upgrade & Restore Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tcg_store_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tcg_store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Build migration artifact
        run: ./mvnw --batch-mode package -DskipTests

      - name: Validate fresh, repeat, upgrade-baseline and backup-restore paths
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: tcg_store_test
          PGUSER: postgres
          DB_URL: jdbc:postgresql://localhost:5432/tcg_store_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          FLYWAY_ENABLED: "true"
        run: |
          set -euo pipefail
          MIGRATION_JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)
          run_migration() {
            java -Dloader.main=com.mythix.tcg.DatabaseMigrationApplication \
              -cp "$MIGRATION_JAR" \
              org.springframework.boot.loader.launch.PropertiesLauncher
          }

          echo "Running Flyway against a fresh database..."
          run_migration
          FRESH_COUNT=$(psql -t -A -c 'SELECT COUNT(*) FROM flyway_schema_history WHERE success;')
          test "$FRESH_COUNT" -eq 10

          echo "Applying development seed separately..."
          psql -v ON_ERROR_STOP=1 -f infra/postgres/init/02-data.sql
          psql -v ON_ERROR_STOP=1 -f infra/postgres/init/03-profile-avatar.sql
          run_migration
          REPEAT_COUNT=$(psql -t -A -c 'SELECT COUNT(*) FROM flyway_schema_history WHERE success;')
          test "$REPEAT_COUNT" -eq 10

          echo "Verifying database integrity and seed separation..."
          TABLE_COUNT=$(psql -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")
          test "$TABLE_COUNT" -ge 10
          CARD_COUNT=$(psql -t -A -c "SELECT COUNT(*) FROM global_cards;")
          test "$CARD_COUNT" -ge 2000
          USER_COUNT=$(psql -t -A -c "SELECT COUNT(*) FROM users;")
          test "$USER_COUNT" -ge 9

          echo "Upgrading a legacy pre-Flyway V8 schema and preserving its data..."
          createdb tcg_store_upgrade
          while IFS= read -r migration; do
            if [[ "$(basename "$migration")" == V9__* ]]; then
              break
            fi
            psql -v ON_ERROR_STOP=1 -d tcg_store_upgrade -f "$migration"
          done < <(find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | sort -V)
          psql -v ON_ERROR_STOP=1 -d tcg_store_upgrade <<'SQL'
          INSERT INTO users (email, password, full_name, role, seller_status)
          VALUES ('legacy-seller@example.test', 'not-a-real-password', 'Legacy Seller', 'USER', 'APPROVED');
          INSERT INTO global_cards (id, name, supertype, set_name, card_number, image_small, image_large, market_price)
          VALUES ('legacy-card', 'Legacy Card', 'Pokémon', 'Legacy Set', '1', 'small', 'large', 10.00);
          INSERT INTO local_cards (seller_id, global_card_id, custom_image_url, condition, language, price, cost, on_hand, reserved, status)
          SELECT id, 'legacy-card', 'https://example.test/legacy.png', 'NM', 'EN', 20.00, 10.00, 2, 0, 'SHOW'
          FROM users WHERE email = 'legacy-seller@example.test';
            INSERT INTO orders (buyer_id, order_number, idempotency_key, status, total_amount, platform_fee, seller_net_amount)
            SELECT id, 'legacy-paid-order', 'legacy-paid-order-key', 'PAID', 20.00, 0.00, 20.00
            FROM users WHERE email = 'legacy-seller@example.test';
          ALTER TABLE global_cards RENAME TO cards;
          ALTER TABLE local_cards RENAME TO products;
          ALTER TABLE products RENAME COLUMN global_card_id TO card_id;
          ALTER TABLE cart_items RENAME COLUMN local_card_id TO product_id;
          ALTER TABLE collection_items RENAME COLUMN global_card_id TO card_id;
          ALTER TABLE order_items RENAME COLUMN local_card_id TO product_id;
          ALTER TABLE order_items RENAME COLUMN global_card_id TO card_id;
          ALTER TABLE order_items RENAME COLUMN card_name_snapshot TO product_name_snapshot;
          SQL
          LEGACY_CARD_COUNT=$(psql -t -A -d tcg_store_upgrade -c 'SELECT COUNT(*) FROM products;')
          DB_URL=jdbc:postgresql://localhost:5432/tcg_store_upgrade run_migration
          BASELINE_COUNT=$(psql -t -A -d tcg_store_upgrade -c "SELECT COUNT(*) FROM flyway_schema_history WHERE type='BASELINE' AND version='8' AND success;")
          test "$BASELINE_COUNT" -eq 1
          V9_COUNT=$(psql -t -A -d tcg_store_upgrade -c "SELECT COUNT(*) FROM flyway_schema_history WHERE type='SQL' AND version='9' AND success;")
          test "$V9_COUNT" -eq 1
          V10_COUNT=$(psql -t -A -d tcg_store_upgrade -c "SELECT COUNT(*) FROM flyway_schema_history WHERE type='SQL' AND version='10' AND success;")
          test "$V10_COUNT" -eq 1
          LEGACY_PAID_ORDER_STATUS=$(psql -t -A -d tcg_store_upgrade -c "SELECT status FROM orders WHERE order_number = 'legacy-paid-order';")
          test "$LEGACY_PAID_ORDER_STATUS" = "CONFIRMED"
          UPGRADED_CARD_COUNT=$(psql -t -A -d tcg_store_upgrade -c 'SELECT COUNT(*) FROM local_cards;')
          test "$UPGRADED_CARD_COUNT" -eq "$LEGACY_CARD_COUNT"
          LEGACY_TABLE_COUNT=$(psql -t -A -d tcg_store_upgrade -c "SELECT COUNT(*) FROM pg_class WHERE relnamespace='public'::regnamespace AND relname IN ('cards', 'products');")
          test "$LEGACY_TABLE_COUNT" -eq 0

          echo "Rehearsing backup and restore before future production migrations..."
          pg_dump --format=custom --file=target/tcg_store_test.dump tcg_store_test
          createdb tcg_store_restore
          pg_restore --exit-on-error --no-owner --dbname=tcg_store_restore target/tcg_store_test.dump
          RESTORED_CARD_COUNT=$(psql -t -A -d tcg_store_restore -c 'SELECT COUNT(*) FROM global_cards;')
          test "$RESTORED_CARD_COUNT" -eq "$CARD_COUNT"
          DB_URL=jdbc:postgresql://localhost:5432/tcg_store_restore run_migration

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate canonical Compose profiles
        env:
          APP_JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes
          NEON_JDBC_URL: jdbc:postgresql://example.invalid/neondb
          NEON_DB_USERNAME: ci-only
          NEON_DB_PASSWORD: ci-only
          OBJECT_STORAGE_ENDPOINT: https://storage.example.invalid
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_BUCKET: tcg-product-images-ci
          OBJECT_STORAGE_PUBLIC_BASE_URL: https://storage.example.invalid/tcg-product-images-ci
          OBJECT_STORAGE_PATH_STYLE: "true"
          OBJECT_STORAGE_ACCESS_KEY: ci-only-access-key
          OBJECT_STORAGE_SECRET_KEY: ci-only-secret-key
        run: |
          docker compose -f docker-compose.desktop.yml --profile local config --quiet
          docker compose -f docker-compose.desktop.yml --profile cloud config --quiet
          kubectl kustomize infra/kubernetes/overlays/neon >/dev/null
          kubectl kustomize infra/kubernetes/overlays/neon/migration >/dev/null

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Read reproducible build metadata
        id: source
        run: |
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for smoke tests
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: tcg-store-backend:ci-test
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            OCI_CREATED=${{ steps.source.outputs.created }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify hardened runtime identity and filesystem
        run: |
          set -euo pipefail
          test "$(docker image inspect tcg-store-backend:ci-test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --pids-limit 256 \
            --entrypoint /bin/sh \
            tcg-store-backend:ci-test \
            -ec 'test "$(id -u)" = 10001; test ! -w /app; test -w /tmp; java -version'

      - name: Scan built image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tcg-store-backend:ci-test
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

  security-scan:
    name: Security & Secret Scan (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

      - name: Run Gitleaks Secret Detection
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact /repo

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
