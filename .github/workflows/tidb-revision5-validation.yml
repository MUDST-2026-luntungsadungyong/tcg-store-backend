name: TiDB Revision 5 Live Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-validation:
    name: Validate provisioned TiDB Revision 5 database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIDB_REVISION5_VALIDATION: "true"
      TIDB_JDBC_URL: ${{ secrets.TIDB_JDBC_URL }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate required secret configuration
        shell: bash
        run: |
          test -n "$TIDB_JDBC_URL"
          test -n "$TIDB_USER"
          test -n "$TIDB_PASSWORD"
          case "$TIDB_JDBC_URL" in
            *"/tcg_store_revision5"*) ;;
            *) echo "TIDB_JDBC_URL must target tcg_store_revision5"; exit 1 ;;
          esac

      - name: Run live Revision 5 smoke test
        run: ./mvnw --batch-mode -Dtest=TidbRevision5LiveValidationTests test
